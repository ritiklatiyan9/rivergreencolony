    <script>
      /* The plum intro plays once per visit (not when reduced motion is requested). */
      try { if (sessionStorage.getItem('rg-intro')) document.documentElement.classList.add('intro-seen'); else sessionStorage.setItem('rg-intro', '1'); } catch (error) { /* Storage blocked: play it. */ }
    </script>
    <style>
      .intro-curtain { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #340c24; color: #f3f3ec; cursor: pointer; animation: intro-lift .95s cubic-bezier(.76, 0, .24, 1) 1.9s forwards; }
      .intro-curtain::before { content: ''; position: absolute; inset: 18px; border: 1px solid #f3f3ec26; pointer-events: none; }
      .intro-title { position: relative; display: flex; flex-direction: column; align-items: center; font: 400 clamp(64px, 11vw, 150px) / .82 'Instrument Serif', 'Times New Roman', serif; letter-spacing: -.01em; text-transform: uppercase; }
      .intro-title > span { display: block; overflow: hidden; padding: .06em .03em .02em; }
      .intro-title > span > span { display: block; transform: translateY(108%); animation: intro-rise 1s cubic-bezier(.25, 1, .5, 1) .1s forwards; }
      .intro-title > span:nth-child(2) > span { animation-delay: .22s; }
      .intro-title em { position: absolute; left: 50%; bottom: -.5em; font: 400 .5em / 1 'Mrs Saint Delafield', cursive; text-transform: none; letter-spacing: 0; white-space: nowrap; padding: .1em .4em .3em; transform: translateX(-34%) rotate(-7deg); clip-path: inset(-40% 100% -60% -20%); animation: intro-write 1.25s cubic-bezier(.33, 0, .67, 1) .65s forwards; }
      .intro-side { position: absolute; top: 50%; font: 400 17px/1 'Instrument Serif', serif; letter-spacing: .6em; text-transform: uppercase; opacity: 0; animation: intro-fade .8s ease .45s forwards; }
      .intro-side-left { left: 12vw; } .intro-side-right { right: 12vw; }
      .intro-tag { position: absolute; bottom: 7vh; font: 700 9px/1.7 'Mona Sans', Arial, sans-serif; font-stretch: 125%; letter-spacing: .14em; text-transform: uppercase; text-align: center; opacity: 0; animation: intro-fade .8s ease .8s forwards; }
      @keyframes intro-rise { to { transform: none; } }
      @keyframes intro-write { to { clip-path: inset(-40% -20% -60% -20%); } }
      @keyframes intro-fade { to { opacity: .82; } }
      @keyframes intro-lift { to { transform: translateY(-100%); visibility: hidden; } }
      .intro-seen .intro-curtain { display: none; }
      @media (prefers-reduced-motion: reduce) { .intro-curtain { display: none; } }
      @media (max-width: 760px) { .intro-side { display: none; } }
    </style>

  <body>
    <div class="intro-curtain" aria-hidden="true" onclick="this.remove()">

      <span class="intro-tag">A Defence Garden community<br />A place to begin.</span>
